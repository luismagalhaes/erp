name: Build and Test ERP Solution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Erp.slnx

      - name: Build
        run: dotnet build Erp.slnx --configuration Release --no-restore

      # The integration tests are left out: they need a real SQL Server, and this runner has none.
      # They run locally against the database described under "Testes" in README.md.
      - name: Test
        run: dotnet test Erp.slnx --configuration Release --no-build --filter "Category!=Integration" --results-directory ./TestResults --logger "trx;LogFilePrefix=test-results" --logger "console;verbosity=detailed"

      - name: List failed tests
        if: failure()
        run: |
          for file in ./TestResults/*.trx; do
            echo "::group::$file"
            python3 - "$file" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          root = ET.parse(sys.argv[1]).getroot()
          for result in root.findall('.//t:UnitTestResult', ns):
              if result.get('outcome') != 'Failed':
                  continue
              print(f"FAILED: {result.get('testName')}")
              for tag in ('Message', 'StackTrace'):
                  node = result.find(f'.//t:Output/t:ErrorInfo/t:{tag}', ns)
                  if node is not None and node.text:
                      print(node.text)
              print('-' * 80)
          PY
            echo "::endgroup::"
          done

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test Results
          path: "**/TestResults/**/*.trx"
          reporter: dotnet-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-trx
          path: "**/TestResults/**/*.trx"
          if-no-files-found: error

  # Deploys to 3 dedicated staging Web Apps — separate resources from production, not slots of them,
  # because slots need a Standard tier or higher and these run on the Free tier. The build is
  # uploaded as an artifact so promote-to-production can deploy the exact same bits instead of
  # rebuilding — what goes live is what was actually verified on staging, not a fresh compile of the
  # same source.
  #
  # One-time setup in Azure, outside this pipeline, before this job can run:
  #   1. Create 3 Web Apps for staging (erp-api-staging, identity-staging, erp-staging — any Free/F1
  #      plan works, they don't need to share a plan with production).
  #   2. On each one's Configuration > Application settings, add ASPNETCORE_ENVIRONMENT=Staging.
  #      Nothing to mark as "sticky" — these are separate apps, not slots, so there is no swap to
  #      protect it from.
  #   3. Download each app's publish profile (Overview > Get publish profile) and add it as the
  #      secret below.
  # With that in place, appsettings.Staging.json / appsettings.Production.json are picked up exactly
  # as ASP.NET Core already does by default — see "Base de dados" and "Testes" in the README.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: staging

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            project: src/Erp.Api/Erp.Api.csproj
            app-name: erp-api
            secret-name: AZURE_WEBAPP_PUBLISH_PROFILE_API

          - name: identity
            project: src/Identity/Erp.Identity/Erp.Identity.csproj
            app-name: identity
            secret-name: AZURE_WEBAPP_PUBLISH_PROFILE_IDENTITY

          - name: main
            project: src/UI/Erp.Main/Erp.Main.csproj
            app-name: erp
            secret-name: AZURE_WEBAPP_PUBLISH_PROFILE_MAIN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ matrix.project }}

      - name: Publish
        run: dotnet publish ${{ matrix.project }} --configuration Release --no-restore --output ./publish/${{ matrix.name }}

      - name: Deploy to the staging Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.app-name }}
          publish-profile: ${{ secrets[matrix.secret-name] }}
          package: ./publish/${{ matrix.name }}

      - name: Upload the build for promote-to-production
        uses: actions/upload-artifact@v5
        with:
          name: publish-${{ matrix.name }}
          path: ./publish/${{ matrix.name }}
          if-no-files-found: error

  # Promotes what is already verified on staging: downloads the same build publish just produced —
  # no rebuild — and deploys it to the 3 production Web Apps (separate resources from staging, see
  # above) with their own publish profiles. Gated by the "production" environment: add required
  # reviewers to it once, in Settings > Environments > production, and this job pauses for approval
  # before it runs.
  #
  # One-time setup in Azure, outside this pipeline, before this job can run:
  #   1. On each production app's Configuration > Application settings, add
  #      ASPNETCORE_ENVIRONMENT=Production (Azure defaults to this already, but setting it explicitly
  #      means the pipeline doesn't depend on an implicit default).
  #   2. Download each app's publish profile (Overview > Get publish profile — a different file from
  #      the staging app's) and add it as the *_PROD secret below.
  promote-to-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: publish
    environment: production

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            app-name: erp-api-prod
            secret-name: AZURE_WEBAPP_PUBLISH_PROFILE_API_PROD
          - name: identity
            app-name: identity-prod
            secret-name: AZURE_WEBAPP_PUBLISH_PROFILE_IDENTITY_PROD
          - name: main
            app-name: erp-prod
            secret-name: AZURE_WEBAPP_PUBLISH_PROFILE_MAIN_PROD

    steps:
      - name: Download the build verified on staging
        uses: actions/download-artifact@v5
        with:
          name: publish-${{ matrix.name }}
          path: ./publish/${{ matrix.name }}

      - name: Deploy to the production Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.app-name }}
          publish-profile: ${{ secrets[matrix.secret-name] }}
          package: ./publish/${{ matrix.name }}