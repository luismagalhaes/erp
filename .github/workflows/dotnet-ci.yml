name: Build and Test ERP Solution

on:
  # build-and-test runs on every PR against main, for quick feedback before merging — this is the
  # only automatic trigger left. A push straight to main runs nothing by itself: building, testing
  # and deploying are all something someone asks for explicitly, below.
  pull_request:
    branches:
      - main
  # Runs build-and-test, then deploys to whichever environment was picked — on request, never on a
  # push to main. See the "deploy" job further down for why, and for what production is restricted to.
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Erp.slnx

      - name: Build
        run: dotnet build Erp.slnx --configuration Release --no-restore

      # The integration tests are left out: they need a real SQL Server, and this runner has none.
      # The E2E tests are left out too: they need Erp.Main/Erp.Identity running and Playwright's
      # browsers installed. Both run locally as described under "Testes" in README.md.
      - name: Test
        run: dotnet test Erp.slnx --configuration Release --no-build --filter "Category!=Integration&Category!=E2E" --results-directory ./TestResults --logger "trx;LogFilePrefix=test-results" --logger "console;verbosity=detailed"

      - name: List failed tests
        if: failure()
        run: |
          for file in ./TestResults/*.trx; do
            echo "::group::$file"
            python3 - "$file" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          root = ET.parse(sys.argv[1]).getroot()
          for result in root.findall('.//t:UnitTestResult', ns):
              if result.get('outcome') != 'Failed':
                  continue
              print(f"FAILED: {result.get('testName')}")
              for tag in ('Message', 'StackTrace'):
                  node = result.find(f'.//t:Output/t:ErrorInfo/t:{tag}', ns)
                  if node is not None and node.text:
                      print(node.text)
              print('-' * 80)
          PY
            echo "::endgroup::"
          done

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: "**/TestResults/**/*.trx"
          reporter: dotnet-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-trx
          path: "**/TestResults/**/*.trx"
          if-no-files-found: error

  # Runs the 21 tests in Erp.IntegrationTests against a dedicated Azure SQL database — never
  # staging's or production's own database, because SqlServerFixture wipes every table before each
  # run (see tests/Erp.IntegrationTests/SqlServerFixture.cs) — pointing it at a shared environment's
  # database would erase it on every run. Gates every deploy: `deploy` needs this job to pass, for
  # both staging and production.
  #
  # The runner isn't on Azure's network, so it can't reach the SQL Server until its IP is let through
  # the firewall — opened for just this job, under a name unique to the run, and always removed at
  # the end (even on failure, via `if: always()`). Azure SQL firewall rules are per-server, not
  # per-database: a rule left open permanently would also expose staging's own database on the same
  # logical server, so the rule only exists for the lifetime of this job. `concurrency` serializes
  # this job across runs — SqlServerFixture clears the whole database at the start, so two runs at
  # once would corrupt each other.
  #
  # One-time setup in Azure, outside this pipeline:
  #   1. Create a dedicated database on the same logical server (e.g. erp-integration-tests) — a
  #      second, non-free database, since the Free tier only covers one.
  #   2. Create a SQL login scoped to just that database (not sa-erp) with db_owner on it — the
  #      tests apply their own migrations and need DDL rights.
  #   3. Register an Azure AD App with a federated credential trusting this repo/workflow (no client
  #      secret stored anywhere — see azure/login's OIDC docs), and assign it a role scoped to only
  #      this SQL Server's firewall rules. Not Contributor, and nothing that can touch the Web Apps
  #      or any other resource.
  #   4. Add the 6 secrets referenced below.
  integration-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-and-test
    concurrency:
      group: erp-integration-tests-db
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Azure login (OIDC — no client secret stored)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Allow this runner through the SQL Server firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group "${{ secrets.AZURE_SQL_RESOURCE_GROUP }}" \
            --server "${{ secrets.AZURE_SQL_SERVER_NAME }}" \
            --name "github-runner-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"

      - name: Run integration tests
        env:
          ERP_TEST_SQL: ${{ secrets.INTEGRATION_TEST_SQL_CONNECTION }}
        run: dotnet test tests/Erp.IntegrationTests/Erp.IntegrationTests.csproj --configuration Release --filter "Category=Integration" --results-directory ./TestResults --logger "trx;LogFilePrefix=integration-test-results" --logger "console;verbosity=detailed"

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Integration Test Results
          path: "**/TestResults/**/*.trx"
          reporter: dotnet-trx

      # Runs even if the tests above failed, or the job was cancelled — an open firewall rule left
      # behind is exactly the kind of thing that stops mattering to anyone until it's a problem.
      - name: Remove this runner from the SQL Server firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group "${{ secrets.AZURE_SQL_RESOURCE_GROUP }}" \
            --server "${{ secrets.AZURE_SQL_SERVER_NAME }}" \
            --name "github-runner-${{ github.run_id }}"

  # Deploys to whichever environment was picked on the "Run workflow" dropdown. Never triggered by
  # push or PR — GitHub's Required reviewers on environments needs a paid plan for a private repo
  # (see "Integração contínua e deploy" in the README), so authorization here is simply that nobody
  # else can start this job: it only exists as a manual button someone has to click, once for staging
  # and again for production when they're ready to go live.
  #
  # Production is further restricted to the main branch: workflow_dispatch lets whoever runs it pick
  # any branch, and without this a manual run from a stray branch could still ship to production.
  # Staging is left open to any branch on purpose, for trying out a branch before it merges.
  #
  # Each app has a staging and a production Web App — separate Azure resources, not slots of one,
  # because slots need a Standard tier or higher and these run on the Free tier. The matrix below
  # carries both names and both secrets per app; which one is used is resolved by `environment ==
  # 'staging'`, from the input picked at dispatch time.
  #
  # One-time setup in Azure, outside this pipeline, before this job can run:
  #   1. Create 6 Web Apps (3 apps × staging/production — any Free/F1 plan works, staging doesn't
  #      need to share a plan with production).
  #   2. On each one's Configuration > Application settings, add ASPNETCORE_ENVIRONMENT — Staging on
  #      the 3 staging apps, Production on the 3 production ones. Nothing to mark as "sticky" — these
  #      are separate apps, not slots, so there is no swap to protect it from. This, not the
  #      pipeline, is what makes appsettings.Staging.json / appsettings.Production.json actually get
  #      picked up — see "Base de dados" in the README.
  #   3. Download each app's publish profile (Overview > Get publish profile) and add the 6 secrets
  #      below.
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.environment == 'staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests]
    environment: ${{ github.event.inputs.environment }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            project: src/Erp.Api/Erp.Api.csproj
            app-name-staging: erp-api
            app-name-production: erp-api-prod
            secret-name-staging: AZURE_WEBAPP_PUBLISH_PROFILE_API
            secret-name-production: AZURE_WEBAPP_PUBLISH_PROFILE_API_PROD

          - name: identity
            project: src/Identity/Erp.Identity/Erp.Identity.csproj
            app-name-staging: identity
            app-name-production: identity-prod
            secret-name-staging: AZURE_WEBAPP_PUBLISH_PROFILE_IDENTITY
            secret-name-production: AZURE_WEBAPP_PUBLISH_PROFILE_IDENTITY_PROD

          - name: main
            project: src/UI/Erp.Main/Erp.Main.csproj
            app-name-staging: erp
            app-name-production: erp-prod
            secret-name-staging: AZURE_WEBAPP_PUBLISH_PROFILE_MAIN
            secret-name-production: AZURE_WEBAPP_PUBLISH_PROFILE_MAIN_PROD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ matrix.project }}

      # -p:Version overrides Directory.Build.props' <Version> for this build only, so the "About"
      # button (Assembly.GetEntryAssembly().GetName().Version) shows which pipeline run produced the
      # deployed build. The "1.0" here is the major/minor and must be bumped together with the one
      # in Directory.Build.props for a real release.
      - name: Publish
        run: dotnet publish ${{ matrix.project }} --configuration Release --no-restore --output ./publish/${{ matrix.name }} -p:Version=1.0.${{ github.run_number }}

      - name: Deploy to the Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ github.event.inputs.environment == 'staging' && matrix.app-name-staging || matrix.app-name-production }}
          publish-profile: ${{ github.event.inputs.environment == 'staging' && secrets[matrix.secret-name-staging] || secrets[matrix.secret-name-production] }}
          package: ./publish/${{ matrix.name }}

  # Drives a real Chromium browser against the staging Web Apps right after they go live — the one
  # check here that exercises the actual deployed sites instead of a build artifact. Staging only:
  # the OIDC client's allowed redirect URIs are registered manually per environment (not part of
  # this pipeline), and production doesn't have its own test user configured yet.
  e2e-tests:
    if: >-
      needs.deploy.result == 'success' &&
      github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build tests/Erp.E2ETests/Erp.E2ETests.csproj --configuration Release

      - name: Install Playwright browsers
        run: pwsh tests/Erp.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests against staging
        env:
          E2E__MainBaseUrl: https://erp-hbhhf5brg7a4agfk.westus3-01.azurewebsites.net
          E2E__IdentityBaseUrl: https://identity-e8fmdrfxb8fqbwhh.westus3-01.azurewebsites.net
          E2E__TestUser__Email: ${{ secrets.E2E_STAGING_TEST_USER_EMAIL }}
          E2E__TestUser__Password: ${{ secrets.E2E_STAGING_TEST_USER_PASSWORD }}
        run: dotnet test tests/Erp.E2ETests/Erp.E2ETests.csproj --configuration Release --no-build --filter "Category=E2E" --results-directory ./TestResults --logger "trx;LogFilePrefix=e2e-test-results" --logger "console;verbosity=detailed" -- xUnit.ReporterSwitch=allure

      # Allure.XUnit attaches each test's Playwright trace as it runs (see PlaywrightFixture.
      # SaveTraceAsync), so allure-results already has everything needed for a browsable report — no
      # copying of trace files needed here. `xUnit.ReporterSwitch=allure` above is required: without
      # it xunit silently skips the Allure reporter and allure-results stays empty.
      #
      # One-time setup in Azure, outside this pipeline:
      #   1. Create the erp-e2e-dashboard Web App (Free tier, same as the others).
      #   2. Download its publish profile and add it as the AZURE_WEBAPP_PUBLISH_PROFILE_DASHBOARD
      #      secret.
      - name: Generate Allure HTML report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate tests/Erp.E2ETests/bin/Release/net10.0/allure-results -o ./e2e-dashboard --clean

      - name: Deploy dashboard to Azure App Service
        if: always()
        uses: azure/webapps-deploy@v3
        with:
          app-name: erp-e2e-dashboard
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DASHBOARD }}
          package: ./e2e-dashboard

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: E2E Test Results
          path: "**/TestResults/**/*.trx"
          reporter: dotnet-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-e2e-trx
          path: "**/TestResults/**/*.trx"
          if-no-files-found: error

      # actions/upload-artifact's archive:false mode names the artifact after the uploaded file
      # itself (the `name:` input is ignored), so the C# test method name would otherwise end up as
      # the artifact's display name on the run's Summary page. Renamed here instead, so it reads
      # e2e-report-* — add a line here whenever a new E2E test is added.
      - name: Rename traces for direct download
        if: always()
        run: |
          cd tests/Erp.E2ETests/bin/Release/net10.0/playwright-traces 2>/dev/null || exit 0
          [ -f Anonymous_user_visiting_main_is_redirected_to_identity_login.zip ] && mv Anonymous_user_visiting_main_is_redirected_to_identity_login.zip e2e-report-login-redirect.zip
          [ -f User_can_sign_in_and_reach_the_dashboard.zip ] && mv User_can_sign_in_and_reach_the_dashboard.zip e2e-report-sign-in.zip

      # One trace per test, pass or fail — a safety net that always catches every trace file, even
      # for a test added later without updating the two convenience uploads below. Downloading this
      # one means unzipping twice (GitHub wraps the artifact, and each trace is already a .zip
      # itself) — kept for completeness, not for day-to-day use.
      - name: Upload Playwright traces (bundle)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: "**/playwright-traces/**"
          if-no-files-found: error

      # Convenience uploads, one per known test, with archive: false (needs actions/upload-artifact
      # v7): GitHub serves these as the raw trace .zip with no outer wrapper, so downloading one and
      # dragging it straight into https://trace.playwright.dev needs no unzipping at all.
      - name: Upload trace - Anonymous redirect
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: "**/playwright-traces/e2e-report-login-redirect.zip"
          archive: false
          if-no-files-found: warn

      - name: Upload trace - Sign in flow
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: "**/playwright-traces/e2e-report-sign-in.zip"
          archive: false
          if-no-files-found: warn