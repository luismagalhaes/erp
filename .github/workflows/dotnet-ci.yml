name: Build and Test ERP Solution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Erp.slnx

      - name: Build
        run: dotnet build Erp.slnx --configuration Release --no-restore

      # The integration tests are left out: they need a real SQL Server, and this runner has none.
      # They run locally against the database described under "Testes" in README.md.
      - name: Test
        run: dotnet test Erp.slnx --configuration Release --no-build --filter "Category!=Integration" --results-directory ./TestResults --logger "trx;LogFilePrefix=test-results" --logger "console;verbosity=detailed"

      - name: List failed tests
        if: failure()
        run: |
          for file in ./TestResults/*.trx; do
            echo "::group::$file"
            python3 - "$file" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          root = ET.parse(sys.argv[1]).getroot()
          for result in root.findall('.//t:UnitTestResult', ns):
              if result.get('outcome') != 'Failed':
                  continue
              print(f"FAILED: {result.get('testName')}")
              for tag in ('Message', 'StackTrace'):
                  node = result.find(f'.//t:Output/t:ErrorInfo/t:{tag}', ns)
                  if node is not None and node.text:
                      print(node.text)
              print('-' * 80)
          PY
            echo "::endgroup::"
          done

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test Results
          path: "**/TestResults/**/*.trx"
          reporter: dotnet-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-trx
          path: "**/TestResults/**/*.trx"
          if-no-files-found: error

  # Deploys to the "staging" slot of each Web App, never straight to production — promotion is a
  # deliberate slot swap done afterwards in Azure, not something this workflow does automatically.
  #
  # One-time setup in Azure, outside this pipeline, before this job can run:
  #   1. Create a "staging" deployment slot on each of the 3 Web Apps (needs Standard tier or higher).
  #   2. On the staging slot's Configuration > Application settings, add ASPNETCORE_ENVIRONMENT=Staging
  #      with "Deployment slot setting" checked, so it is *sticky* and survives a swap instead of
  #      following the code to production. Do the same on the production slot with the value
  #      ASPNETCORE_ENVIRONMENT=Production. Set once; the pipeline never touches it again.
  #   3. Download the staging slot's own publish profile (Deployment slot > Get publish profile — it
  #      is different from the production slot's) and add it as the *_STAGING secret below.
  # With that in place, appsettings.Staging.json / appsettings.Production.json are picked up exactly
  # as ASP.NET Core already does by default — see "Base de dados" and "Testes" in the README.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-test

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            project: src/Erp.Api/Erp.Api.csproj
            app-name: erp-api
            secret-name: AZURE_WEBAPP_PUBLISH_PROFILE_API_STAGING

          - name: identity
            project: src/Identity/Erp.Identity/Erp.Identity.csproj
            app-name: identity
            secret-name: AZURE_WEBAPP_PUBLISH_PROFILE_IDENTITY_STAGING

          - name: main
            project: src/UI/Erp.Main/Erp.Main.csproj
            app-name: erp
            secret-name: AZURE_WEBAPP_PUBLISH_PROFILE_MAIN_STAGING

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ matrix.project }}

      - name: Publish
        run: dotnet publish ${{ matrix.project }} --configuration Release --no-restore --output ./publish/${{ matrix.name }}

      - name: Deploy to Azure Web App staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.app-name }}
          slot-name: staging
          publish-profile: ${{ secrets[matrix.secret-name] }}
          package: ./publish/${{ matrix.name }}