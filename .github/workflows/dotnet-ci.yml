name: Build and Test ERP Solution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Deploys are never automatic — build-and-test still runs on every push/PR as a safety net, but
  # going live is always someone deliberately picking an environment here and clicking Run workflow.
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Erp.slnx

      - name: Build
        run: dotnet build Erp.slnx --configuration Release --no-restore

      # The integration tests are left out: they need a real SQL Server, and this runner has none.
      # They run locally against the database described under "Testes" in README.md.
      - name: Test
        run: dotnet test Erp.slnx --configuration Release --no-build --filter "Category!=Integration" --results-directory ./TestResults --logger "trx;LogFilePrefix=test-results" --logger "console;verbosity=detailed"

      - name: List failed tests
        if: failure()
        run: |
          for file in ./TestResults/*.trx; do
            echo "::group::$file"
            python3 - "$file" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          root = ET.parse(sys.argv[1]).getroot()
          for result in root.findall('.//t:UnitTestResult', ns):
              if result.get('outcome') != 'Failed':
                  continue
              print(f"FAILED: {result.get('testName')}")
              for tag in ('Message', 'StackTrace'):
                  node = result.find(f'.//t:Output/t:ErrorInfo/t:{tag}', ns)
                  if node is not None and node.text:
                      print(node.text)
              print('-' * 80)
          PY
            echo "::endgroup::"
          done

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test Results
          path: "**/TestResults/**/*.trx"
          reporter: dotnet-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-trx
          path: "**/TestResults/**/*.trx"
          if-no-files-found: error

  # Deploys to whichever environment was picked on the "Run workflow" dropdown. Never triggered by
  # push or PR — GitHub's Required reviewers on environments needs a paid plan for a private repo
  # (see "Integração contínua e deploy" in the README), so authorization here is simply that nobody
  # else can start this job: it only exists as a manual button someone has to click, once for staging
  # and again for production when they're ready to go live.
  #
  # Each app has a staging and a production Web App — separate Azure resources, not slots of one,
  # because slots need a Standard tier or higher and these run on the Free tier. The matrix below
  # carries both names and both secrets per app; which one is used is resolved by `environment ==
  # 'staging'`, from the input picked at dispatch time.
  #
  # One-time setup in Azure, outside this pipeline, before this job can run:
  #   1. Create 6 Web Apps (3 apps × staging/production — any Free/F1 plan works, staging doesn't
  #      need to share a plan with production).
  #   2. On each one's Configuration > Application settings, add ASPNETCORE_ENVIRONMENT — Staging on
  #      the 3 staging apps, Production on the 3 production ones. Nothing to mark as "sticky" — these
  #      are separate apps, not slots, so there is no swap to protect it from. This, not the
  #      pipeline, is what makes appsettings.Staging.json / appsettings.Production.json actually get
  #      picked up — see "Base de dados" in the README.
  #   3. Download each app's publish profile (Overview > Get publish profile) and add the 6 secrets
  #      below.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: ${{ github.event.inputs.environment }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            project: src/Erp.Api/Erp.Api.csproj
            app-name-staging: erp-api-staging
            app-name-production: erp-api-prod
            secret-name-staging: AZURE_WEBAPP_PUBLISH_PROFILE_API
            secret-name-production: AZURE_WEBAPP_PUBLISH_PROFILE_API_PROD

          - name: identity
            project: src/Identity/Erp.Identity/Erp.Identity.csproj
            app-name-staging: identity-staging
            app-name-production: identity-prod
            secret-name-staging: AZURE_WEBAPP_PUBLISH_PROFILE_IDENTITY
            secret-name-production: AZURE_WEBAPP_PUBLISH_PROFILE_IDENTITY_PROD

          - name: main
            project: src/UI/Erp.Main/Erp.Main.csproj
            app-name-staging: erp-staging
            app-name-production: erp-prod
            secret-name-staging: AZURE_WEBAPP_PUBLISH_PROFILE_MAIN
            secret-name-production: AZURE_WEBAPP_PUBLISH_PROFILE_MAIN_PROD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ matrix.project }}

      - name: Publish
        run: dotnet publish ${{ matrix.project }} --configuration Release --no-restore --output ./publish/${{ matrix.name }}

      - name: Deploy to the Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ github.event.inputs.environment == 'staging' && matrix.app-name-staging || matrix.app-name-production }}
          publish-profile: ${{ github.event.inputs.environment == 'staging' && secrets[matrix.secret-name-staging] || secrets[matrix.secret-name-production] }}
          package: ./publish/${{ matrix.name }}